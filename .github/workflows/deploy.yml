name: Backend CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Package application
        run: ./mvnw -B clean package -DskipTests

      - name: Prepare deployment files
        run: |
          JAR_FILE=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "*original*" | head -n 1)
          test -n "$JAR_FILE"
          cp "$JAR_FILE" app.jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Get SSH deploy key
        run: |
          aws secretsmanager get-secret-value \
            --secret-id japan-newhire/deploy/ssh-key \
            --query SecretString \
            --output text > deploy_key
          chmod 600 deploy_key

      - name: Upload deployment files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          scp -i deploy_key app.jar Dockerfile "$EC2_USER@$EC2_HOST:/home/$EC2_USER/"

      - name: Deploy backend container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i deploy_key "$EC2_USER@$EC2_HOST" \
            EC2_USER="$EC2_USER" IMAGE_TAG="$IMAGE_TAG" 'bash -s' <<'EOF'
          set -e

          cd "/home/$EC2_USER"

          ENV_FILE="/home/ubuntu/deploy/api/.env"

          if [ ! -f "$ENV_FILE" ]; then
            echo "Required backend runtime env file is missing."
            exit 1
          fi

          if [ ! -r "$ENV_FILE" ]; then
            echo "Backend runtime env file is not readable."
            exit 1
          fi

          if [ "$(stat -c '%a' "$ENV_FILE")" != "600" ]; then
            echo "Backend runtime env file must have permission 600."
            exit 1
          fi

          if grep -q '^RAG_AI_SERVER_BASE_URI=' "$ENV_FILE"; then
            echo "Legacy AI base URI variable is not supported."
            exit 1
          fi

          if [ "$(grep -c '^RAG_AI_SERVER_BASE_URL=' "$ENV_FILE")" -ne 1 ]; then
            echo "Required AI base URL must be configured exactly once."
            exit 1
          fi

          AI_BASE_URL=$(sed -n 's/^RAG_AI_SERVER_BASE_URL=//p' "$ENV_FILE")
          if [ "$AI_BASE_URL" != "http://my-service-ai:5001" ]; then
            echo "Required AI base URL is missing or does not match the production service."
            exit 1
          fi

          docker build \
            -t "my-service-api:$IMAGE_TAG" \
            -t "my-service-api:latest" \
            .

          docker rm -f my-service-api 2>/dev/null || true

          docker run -d \
            --name my-service-api \
            --restart unless-stopped \
            --network deploy_my-service-net \
            -p 8080:8080 \
            --env-file "$ENV_FILE" \
            "my-service-api:$IMAGE_TAG"

          for i in {1..12}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              echo "Backend health check passed."
              break
            fi

            if [ "$i" -eq 12 ]; then
              echo "Backend health check failed."
              docker logs --tail 100 my-service-api
              exit 1
            fi

            echo "Waiting for backend... ($i/12)"
            sleep 5
          done

          docker image prune -f
          EOF
