spring.application.name=japan-newhire-rag-backend

spring.datasource.url=jdbc:mysql://localhost:3306/japan_newhire_rag?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia%2FSeoul
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

auth.token.secret=${JWT_SECRET}
auth.token.access-token-expiration=15m
auth.token.refresh-token-expiration=14d

auth.cookie.name=refresh_token
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie.path=/api/auth
auth.cookie.max-age=14d

auth.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

document.storage.root-directory=${DOCUMENT_STORAGE_ROOT:./data/documents}

document.chunk.max-chunk-size=${DOCUMENT_CHUNK_MAX_SIZE:1000}
document.chunk.overlap-size=${DOCUMENT_CHUNK_OVERLAP_SIZE:100}
